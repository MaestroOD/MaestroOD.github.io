<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="apple-touch-icon" href="../../../images/apple-touch-icon.png">
  <script>
    /* Pick the theme before first paint: saved choice, else the OS preference. */
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="../../../assets/site.css">
</head>
<body class="app">
  <header>
    <nav class="container" aria-label="Primary navigation">
      <a class="brand" href="../../../">Adam Murdock Gale</a>
      <div class="nav-right">
        <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
          <img class="chao chao-dark" src="../../../images/dark-chao.png" alt="" width="37" height="40">
          <img class="chao chao-hero" src="../../../images/hero-chao.png" alt="" width="23" height="40">
        </button>
        <div class="nav-links">
        <a href="../../../#about">About</a>

        <a href="../../../#irl">irl</a>
        <a href="../../../#contact">Contact</a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section id="practice" class="practice-app">
      <div class="practice-bar container">
        <p class="breadcrumb"><a href="../../../#teaching">Teaching</a> / <a href="../">CS 3350A</a> / <strong>Practice</strong></p>
        <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="practice-menu" aria-expanded="false">☰ <span id="menu-toggle-label">topics</span></button>
      </div>
      <noscript><p class="container">the practice problems need javascript.</p></noscript>

      <div class="practice-layout container">
          <nav class="practice-menu" id="practice-menu" aria-label="Topics and problems"></nav>
          <article class="problem-panel" id="problem-panel" aria-labelledby="problem-title">
            <div class="problem-head">
              <h2 id="problem-title">Problem</h2>
              <button class="cheat-btn" id="cheat-btn" type="button" aria-expanded="false" aria-controls="cheat-pop" hidden>[toggle cheat sheet]</button>
